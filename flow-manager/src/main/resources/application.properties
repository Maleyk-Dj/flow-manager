spring.application.name=flow-manager
spring.datasource.url=jdbc:postgresql://localhost:5433/flowmanager
spring.datasource.username=flowmanager_user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flow-manager-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

kafka.topics.input=files.input
kafka.topics.output=files.output

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.source-bucket=source-files

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/