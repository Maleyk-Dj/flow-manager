services:
  postgres:
    image: postgres:16
    container_name: flowmanager-postgres
    environment:
      POSTGRES_USER: flowmanager_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowmanager
    ports:
      - "5433:5432"
    volumes:
      - flowmanager_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: flowmanager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  flowmanager_pgdata:
  minio-data: